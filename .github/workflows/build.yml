name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ghostcore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mods/ghostcore
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build
      - name: GameTests
        run: ./gradlew runGameTestServer
      - uses: actions/upload-artifact@v4
        with:
          name: ghostcore
          path: mods/ghostcore/build/libs/*.jar
